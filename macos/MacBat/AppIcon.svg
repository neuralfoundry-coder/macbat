<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- MacBat app icon: battery with a charge-limit marker. Rendered to AppIcon.icns by macos/make-icon.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63b3ff"/>
      <stop offset="1" stop-color="#2160d8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="charge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f1ff"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>
  </g>
  <!-- battery body, terminal, charge -->
  <rect x="226" y="384" width="528" height="256" rx="70" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="34"/>
  <rect x="772" y="462" width="44" height="100" rx="20" fill="#ffffff"/>
  <rect x="270" y="428" width="352" height="168" rx="36" fill="url(#charge)"/>
  <!-- the limit: a marker through the battery at 80% -->
  <rect x="652" y="324" width="22" height="376" rx="11" fill="#ffffff"/>
  <circle cx="663" cy="324" r="26" fill="#ffffff"/>
</svg>
